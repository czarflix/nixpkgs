name: Offen x86_64 verify

on:
  workflow_dispatch:
  push:
    branches:
      - offen-nixpkgs-x86-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Assert native x86_64 runner
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          printf 'RUNNER_ARCH=%s\n' "$arch"
          test "$arch" = "x86_64"

      - name: Build Offen and run smoke test
        run: |
          set -euo pipefail

          mkdir -p logs

          docker run --rm \
            -e NIXPKGS_ALLOW_UNFREE=1 \
            -v "$PWD:/work" \
            -w /work \
            nixos/nix:latest \
            sh -lc '
          set -euo pipefail

          git config --global --add safe.directory /work

          pkg=$(nix --extra-experimental-features nix-command build \
            --impure \
            --print-out-paths \
            --expr '"'"'let pkgs = import ./. { system = builtins.currentSystem; config.allowUnfree = true; }; in pkgs.offen'"'"' \
            -L \
            --show-trace)
          printf "PKG=%s\n" "$pkg"

          smoke=$(nix --extra-experimental-features nix-command build \
            --impure \
            --print-out-paths \
            --expr '"'"'let pkgs = import ./. { system = builtins.currentSystem; config.allowUnfree = true; }; in pkgs.offen.passthru.tests.smoke'"'"' \
            -L \
            --show-trace)
          printf "SMOKE=%s\n" "$smoke"
          ' |& tee logs/offen-nixpkgs-x86-build.log

          grep '^PKG=' logs/offen-nixpkgs-x86-build.log
          grep '^SMOKE=' logs/offen-nixpkgs-x86-build.log
          grep 'revision=ec99082a37ffb5855bd84debfef227d41c7b403c' logs/offen-nixpkgs-x86-build.log

      - name: Run nixpkgs-review
        run: |
          set -euo pipefail

          mkdir -p nixpkgs-review-artifacts

          docker run --rm \
            -e NIXPKGS_ALLOW_UNFREE=1 \
            -v "$PWD:/work" \
            -w /work \
            nixos/nix:latest \
            sh -lc '
          set -euo pipefail

          git config --global --add safe.directory /work
          rm -rf /work/nixpkgs-review-artifacts

          nix --extra-experimental-features '"'"'nix-command flakes'"'"' run github:Mic92/nixpkgs-review -- \
            rev HEAD --no-shell --print-result -p offen \
            --extra-nixpkgs-config '"'"'{ allowUnfree = true; }'"'"'

          cp -R /root/.cache/nixpkgs-review /work/nixpkgs-review-artifacts
          ' |& tee logs/offen-nixpkgs-x86-review.log

          grep 'offen' logs/offen-nixpkgs-x86-review.log
          grep 'x86_64-linux' logs/offen-nixpkgs-x86-review.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixpkgs-offen-x86-logs
          path: logs
          if-no-files-found: error

      - name: Upload nixpkgs-review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixpkgs-offen-review-artifacts
          path: nixpkgs-review-artifacts
          if-no-files-found: error
